<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRISTI 2.0 — Domain Model</title>
<style>
  :root{
    /* PUCAR design system — shape + type (theme-independent) */
    --radius:10px; font-synthesis:none;
    --font-sans:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
    --font-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    /* ---------- LIGHT (Radix scales, PUCAR mapping) ---------- */
    --bg:#fcfcfd; --sidebar-bg:#f9f9fb; --panel:#ffffff; --panel-2:#f4f4f7; --line:#e8e8ec; --line-2:#cdced6;
    --ink:#1c2024; --ink-2:#60646c; --ink-3:#8b8d98;
    --brand:#007e7e; --brand-accent:#12a594; --brand-hi:#008573; --brand-dim:#e0f8f3; --brand-border:#a1ded2; --link:#007e7e;
    --blue:#0d74ce; --blue-txt:#0d74ce; --blue-dim:#e6f4fe; --blue-border:#acd8fc;
    --green:#217a3a; --green-txt:#2a7e3b; --green-dim:#e9f6e9; --green-border:#b2ddb5;
    --amber:#e2a336; --amber-txt:#ab6400; --amber-dim:#fff7c2; --amber-border:#e9c162;
    --purple:#6e56cf; --purple-txt:#6e56cf; --purple-dim:#f1eefe; --purple-border:#d3c9f5;
    --teal:#007e7e; --teal-dim:#e0f8f3;
    --red:#c1232a; --red-dim:#feebec; --red-border:#f4a9aa;
    --shadow-raised:0 1px 2px 0 rgb(0 0 0/.04),0 1px 3px 0 rgb(0 0 0/.07);
    --shadow-modal:0 24px 60px -12px rgb(0 0 0/.25),0 8px 20px -8px rgb(0 0 0/.14);
  }
  html.dark{
    /* ---------- DARK (Radix scales, PUCAR mapping) ---------- */
    --bg:#111113; --sidebar-bg:#18191b; --panel:#18191b; --panel-2:#1d1e21; --line:#282b2f; --line-2:#43484e;
    --ink:#edeef0; --ink-2:#b0b4ba; --ink-3:#777b84;
    --brand:#0eb39e; --brand-accent:#12a594; --brand-hi:#0bd8b6; --brand-dim:#0d2d2a; --brand-border:#1c6961; --link:#0bd8b6;
    --blue:#3b9eff; --blue-txt:#70b8ff; --blue-dim:#0d2847; --blue-border:#205d9e;
    --green:#46a758; --green-txt:#71d083; --green-dim:#1b2a1e; --green-border:#2d5736;
    --amber:#ffc53d; --amber-txt:#ffca16; --amber-dim:#302008; --amber-border:#5c3d05;
    --purple:#9e8cff; --purple-txt:#c4b8ff; --purple-dim:#231d3d; --purple-border:#4a3d7a;
    --teal:#0bd8b6; --teal-dim:#0d2d2a;
    --red:#ec5d5e; --red-dim:#3b1219; --red-border:#72232d;
    --shadow-raised:0 1px 2px 0 rgb(0 0 0/.25),0 1px 3px 0 rgb(0 0 0/.4);
    --shadow-modal:0 24px 70px -10px rgb(0 0 0/.7),0 8px 24px -8px rgb(0 0 0/.5);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg); color:var(--ink); font-family:var(--font-sans);
    font-size:15px; line-height:1.55; letter-spacing:.01em; -webkit-font-smoothing:antialiased;}
  a{color:var(--link); text-decoration:none} a:hover{text-decoration:underline}
  .theme-toggle{display:inline-flex; gap:3px; background:var(--panel-2); border:1px solid var(--line); border-radius:20px; padding:3px}
  .tt-opt{display:inline-flex; align-items:center; justify-content:center; width:32px; height:28px; border-radius:16px; cursor:pointer; color:var(--ink-3); user-select:none}
  .tt-opt svg.lu{width:15px; height:15px}
  .tt-opt.on{background:var(--brand-dim); color:var(--brand-hi)}

  .app{display:grid; grid-template-columns:280px 1fr; min-height:100vh}
  .sidebar{background:var(--sidebar-bg); border-right:1px solid var(--line); padding:22px 16px; position:sticky; top:0; height:100vh; overflow-y:auto; display:flex; flex-direction:column}
  .nav-scoped{margin-top:6px}
  .main{padding:40px 48px 120px; max-width:1180px}

  /* mobile: off-canvas drawer behind a hamburger; active case type stays in the top bar */
  .topbar{display:none}
  .backdrop{display:none}
  .hamburger{display:inline-flex; align-items:center; justify-content:center; width:38px; height:38px; border:1px solid var(--line); border-radius:9px; background:var(--panel); color:var(--ink); cursor:pointer; flex:none; padding:0}
  .hamburger svg.lu{width:20px; height:20px}
  @media(max-width:880px){
    .topbar{display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:50; background:var(--sidebar-bg); border-bottom:1px solid var(--line); padding:10px 14px}
    .tb-brand{font-weight:700; font-size:15px; letter-spacing:-.01em}
    .tb-case{margin-left:auto; font-size:12.5px; color:var(--ink-2); background:color-mix(in srgb,var(--brand) 10%,var(--panel)); border:1px solid var(--brand-border); border-radius:20px; padding:5px 12px; max-width:52vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
    .app{grid-template-columns:1fr}
    .sidebar{position:fixed; top:0; left:0; height:100dvh; width:280px; max-width:86vw; transform:translateX(-100%); transition:transform .25s ease; z-index:70; border-right:1px solid var(--line); box-shadow:var(--shadow-modal)}
    .sidebar.open{transform:none}
    .backdrop.show{display:block; position:fixed; inset:0; background:rgb(0 0 0/.5); z-index:65}
    .main{padding:24px 18px 90px}
  }

  .brand{display:flex; gap:10px; align-items:center; margin-bottom:14px; padding:0 6px; cursor:pointer}
  .brand .mark{width:30px; height:30px; border-radius:8px; flex:none;
    background:linear-gradient(135deg,var(--brand),var(--blue)); display:grid; place-items:center; font-weight:800; color:#fff; font-size:14px}
  .brand h1{font-size:15px; margin:0; letter-spacing:.2px; line-height:1.2}
  .brand p{font-size:11.5px; color:var(--ink-3); margin:1px 0 0; line-height:1.2}

  .nav-group{margin:18px 0 6px; padding:0 8px; font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3)}
  .nav-group:first-child{margin-top:4px}
  .nav-group.scoped{color:var(--brand)}
  /* Overview: subtle footer disclosure, de-emphasised vs the main nav */
  .ov-foot-wrap{margin:0 0 10px}
  .ov-foot a.ov-toggle{font-size:12.5px; color:var(--ink-3); padding:6px 10px; gap:9px}
  .ov-foot a.ov-toggle .ico{width:15px; opacity:.6}
  .ov-foot a.ov-toggle .ico svg.lu{width:14px; height:14px}
  .ov-foot a.ov-toggle .nav-chev svg.lu{width:11px; height:11px}
  .ov-foot a.ov-toggle:hover{color:var(--ink); background:var(--panel)}
  .ov-foot a.ov-toggle.active{background:transparent; color:var(--brand-hi)}
  .ov-foot .nav-sub{margin:1px 0 2px 15px}
  .ov-foot .nav-sub a.subnav{font-size:12px; padding:5px 9px; color:var(--ink-3)}
  .ov-foot .nav-sub a.subnav:hover{color:var(--ink)}
  .ov-foot .nav-sub a.subnav.active{color:var(--brand-hi)}
  .nav a{display:flex; align-items:center; gap:11px; padding:8px 10px; border-radius:8px; color:var(--ink-2); font-size:14px; margin:1px 0; cursor:pointer}
  .nav a .ico{width:18px; display:inline-flex; align-items:center; justify-content:center; opacity:.85}
  svg.lu{width:1em; height:1em; vertical-align:-.14em; flex:none}
  .nav a .ico svg.lu{width:16px; height:16px}
  .nav .nav-sub a.subnav .ico svg.lu{width:14.5px; height:14.5px}
  .nav a.ov-toggle .nav-chev svg.lu{width:13px; height:13px; vertical-align:0}
  .casedd-chev svg.lu{width:12px; height:12px; vertical-align:0}
  .nav a .count{margin-left:auto; font-size:11.5px; color:var(--ink-3); background:var(--panel-2); padding:1px 7px; border-radius:20px}
  .nav a:hover{background:var(--panel); color:var(--ink); text-decoration:none}
  .nav a.active{background:var(--brand-dim); color:var(--brand-hi)}
  .nav a.active .count{background:var(--brand-border); color:#fff}
  .nav .scoped-wrap{margin:2px 0 0}
  .nav a.ov-toggle .nav-chev{margin-left:auto; font-size:10px; color:var(--ink-3); transition:transform .28s ease}
  .nav .scoped-wrap:not(.ov-collapsed) a.ov-toggle .nav-chev{transform:rotate(180deg)}
  .nav .nav-sub{margin:1px 0 3px 19px; display:grid; grid-template-rows:1fr; opacity:1; transition:grid-template-rows .28s ease, opacity .22s ease, margin .28s ease}
  .nav .scoped-wrap.ov-collapsed .nav-sub{grid-template-rows:0fr; opacity:0; margin-top:0; margin-bottom:0}
  .nav .nav-sub-inner{min-height:0; overflow:hidden; padding-left:11px; border-left:1px solid var(--line-2); display:flex; flex-direction:column}
  .nav .nav-sub a.subnav{font-size:13px; color:var(--ink-3); padding:6px 9px}
  .nav .nav-sub a.subnav .ico{font-size:12.5px; opacity:.7}
  .nav .nav-sub a.subnav:hover{color:var(--ink)}
  .nav .nav-sub a.subnav.active{color:var(--brand-hi)}
  .casedd{position:relative; margin:6px 4px 10px}
  .casedd-btn{display:block; width:100%; text-align:left; background:color-mix(in srgb,var(--brand) 10%,var(--panel)); border:1px solid var(--brand-border); border-radius:10px; padding:10px 30px 10px 12px; cursor:pointer; color:inherit; font-family:inherit; position:relative; transition:border-color .12s}
  .casedd-btn:hover{border-color:var(--brand)}
  .casedd-chev{position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--brand-hi); font-size:10px; transition:transform .15s}
  .casedd.open .casedd-chev{transform:translateY(-50%) rotate(180deg)}
  .ac-eyebrow{font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--brand-hi); font-weight:700; display:flex; align-items:center; gap:7px}
  .ac-eyebrow::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--brand); box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
  .ac-name{font-size:14.5px; font-weight:700; color:var(--ink); margin-top:4px}
  .ac-name span{color:var(--ink-3); font-weight:400; font-size:12px}
  /* state selector — neutral styling to sit below (and distinct from) the case type */
  .statedd{margin-top:-4px}
  .statedd .casedd-btn{background:var(--panel); border-color:var(--line-2)}
  .statedd .casedd-btn:hover{border-color:var(--ink-3)}
  .statedd .ac-eyebrow{color:var(--ink-3)}
  .statedd .ac-eyebrow::before{display:none}
  .statedd .ac-eyebrow svg.lu{width:11px; height:11px}
  .statedd .casedd-chev{color:var(--ink-3)}
  .casedd-menu{display:none; position:absolute; left:0; right:0; top:calc(100% + 5px); background:var(--panel); border:1px solid var(--line-2); border-radius:10px; box-shadow:var(--shadow-modal); padding:5px; z-index:30}
  .casedd.open .casedd-menu{display:block}
  .casedd-item{padding:9px 11px; border-radius:7px; cursor:pointer; font-size:13.5px; color:var(--ink); display:flex; align-items:center; gap:8px}
  .casedd-item:hover{background:var(--panel-2)}
  .casedd-item.on{color:var(--brand-hi)}
  .casedd-item .ci-sub{color:var(--ink-3); font-size:12px}
  .casedd-item .ci-check{margin-left:auto; color:var(--brand); font-size:12px}
  .casedd-item.planned{color:var(--ink-3); cursor:default}
  .casedd-item.planned:hover{background:none}

  .side-foot{margin-top:auto; padding:16px 10px 0; border-top:1px solid var(--line); font-size:12px; color:var(--ink-3); line-height:1.5}
  .side-foot b{color:var(--ink-2); font-weight:600}

  .page-title{font-size:32px; font-weight:700; margin:0 0 6px; letter-spacing:-.02em; line-height:1.15}
  .lede{color:var(--ink-2); font-size:16px; max-width:770px; margin:0 0 30px}
  .lede strong{color:var(--ink)}
  h2.sec{font-size:13px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); margin:36px 0 14px; font-weight:700}
  /* prominent act-group header inside lists */
  .grouphead{font-size:19px; font-weight:700; color:var(--ink); letter-spacing:-.01em; margin:30px 0 12px; padding-bottom:9px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:10px}
  .grouphead .gh-status{font-size:11.5px; font-weight:500; color:var(--ink-3); letter-spacing:0}

  .scopebar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin:0 0 20px; padding:9px 14px; background:var(--panel); border:1px solid var(--line); border-radius:10px; font-size:13px}
  .scopebar .lab{color:var(--ink-3); font-size:12px; letter-spacing:.03em; text-transform:uppercase}
  .scopebar .ct{color:var(--ink); font-weight:600}
  .scopebar .sw{margin-left:auto; color:var(--brand); cursor:pointer; font-size:12.5px}

  .card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; margin-bottom:14px}
  .muted{color:var(--ink-2)} .tiny{font-size:12.5px; color:var(--ink-3)}

  .badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; padding:2px 9px; border-radius:20px; border:1px solid transparent; white-space:nowrap}
  .b-shared{color:var(--blue-txt); background:var(--blue-dim); border-color:var(--blue-border)}
  .b-state{color:var(--green-txt); background:var(--green-dim); border-color:var(--green-border)}
  .b-always{color:var(--ink-2); background:var(--panel-2); border-color:var(--line-2)}
  .b-pre{color:var(--ink-2); background:var(--panel-2); border-color:var(--line-2)}
  .b-post{color:var(--amber-txt); background:var(--amber-dim); border-color:var(--amber-border)}
  .b-tier{color:var(--purple-txt); background:var(--purple-dim); border-color:var(--purple-border)}
  .b-active{color:var(--green-txt); background:var(--green-dim); border-color:var(--green-border)}
  .b-planned{color:var(--ink-3); background:var(--panel-2); border-color:var(--line)}
  .b-crosscase{color:var(--brand-hi); background:var(--brand-dim); border-color:var(--brand-border)}
  .dot{width:8px; height:8px; border-radius:50%; display:inline-block}

  .lenses{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin:6px 0 8px}
  @media(max-width:760px){.lenses{grid-template-columns:1fr}}
  .lens{--acc:var(--blue); --acctx:var(--blue-txt); border-radius:var(--radius); padding:18px; border:1px solid color-mix(in srgb,var(--acc) 22%,var(--line)); background:color-mix(in srgb,var(--acc) 5%,var(--panel))}
  .lens.what{--acc:var(--blue); --acctx:var(--blue-txt)} .lens.where{--acc:var(--green); --acctx:var(--green-txt)} .lens.when{--acc:var(--amber); --acctx:var(--amber-txt)}
  .lens .k{font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--acctx); font-weight:700; display:flex; align-items:center; gap:7px}
  .lens .k::before{content:""; width:7px; height:7px; border-radius:50%; background:var(--acc)}
  .lens h3{margin:6px 0 7px; font-size:18px} .lens p{margin:0; font-size:13.5px; color:var(--ink-2)}

  .ctgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:14px}
  .ctcard{border:1px solid var(--line); border-radius:var(--radius); background:var(--panel); padding:18px 20px; position:relative}
  .ctcard.active{border-color:var(--green-border); cursor:pointer; transition:transform .12s, border-color .12s}
  .ctcard.active:hover{transform:translateY(-2px); border-color:var(--green)}
  .ctcard.planned{opacity:.72}
  .ctcard .cth{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .ctcard h3{margin:0; font-size:18px}
  .ctcard .act{font-family:var(--font-mono); font-size:12.5px; color:var(--ink-3); margin:3px 0 10px}
  .ctcard p{margin:0 0 12px; font-size:13.5px; color:var(--ink-2)}
  .ctcard .stat{display:flex; gap:16px; font-size:12px; color:var(--ink-3); border-top:1px solid var(--line); padding-top:11px}
  .ctcard .stat b{color:var(--ink); font-weight:650; font-size:15px; display:block}
  .ctcard .enter{margin-top:12px; font-size:13px; color:var(--green)}

  .struct-wrap{display:grid; grid-template-columns:1.15fr .85fr; gap:22px; margin-top:8px}
  @media(max-width:860px){.struct-wrap{grid-template-columns:1fr}}
  .stack{display:flex; flex-direction:column; gap:8px}
  .col-h{font-size:13px; font-weight:700; letter-spacing:.04em; margin:0 0 4px}
  .col-h.rules{color:var(--blue)} .col-h.sys{color:var(--amber)}
  .layer{border-radius:10px; padding:12px 14px; border:1px solid var(--line); background:var(--panel)}
  .layer .lt{font-size:14.5px; font-weight:600} .layer .ld{font-size:12.5px; color:var(--ink-3); margin-top:2px}
  .layer.core{background:color-mix(in srgb,var(--blue) 9%,var(--panel)); border-color:var(--blue-border)}
  .layer.state{background:color-mix(in srgb,var(--green) 9%,var(--panel)); border-color:var(--green-border)}
  .layer.sysrow{background:color-mix(in srgb,var(--amber) 9%,var(--panel)); border-color:var(--amber-border)}
  .layer.you{outline:1.5px solid var(--brand); outline-offset:-1px}
  .divider{display:flex; align-items:center; gap:10px; margin:6px 2px; font-size:11.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase}
  .divider.blue{color:var(--blue)} .divider.green{color:var(--green)} .divider .rule{flex:1; height:1px; background:var(--line)}
  .ctx{margin-top:14px; border:1px solid var(--red-border); background:color-mix(in srgb,var(--red) 7%,var(--panel)); border-radius:10px; padding:14px 16px}
  .ctx .ct{color:var(--red); font-weight:700; font-size:13px; letter-spacing:.03em; margin-bottom:6px}
  .ctx p{margin:3px 0; font-size:13px; color:var(--ink-2)}

  .timeline{margin-top:20px; padding:18px 20px 30px; border:1px solid var(--line); border-radius:12px; background:var(--panel)}
  .tl-track{position:relative; height:2px; background:var(--line); margin:34px 8px 72px}
  .tl-node{position:absolute; top:-6px; transform:translateX(-50%); text-align:center}
  .tl-node .pt{width:11px; height:11px; border-radius:50%; background:var(--amber); margin:0 auto; border:2px solid var(--bg)}
  .tl-node .yr{font-size:12px; font-weight:700; margin-top:8px; color:var(--ink)}
  .tl-node .lb{font-size:11px; color:var(--ink-3); white-space:nowrap; max-width:130px}
  .tl-node.hot .pt{background:var(--red); box-shadow:0 0 0 4px color-mix(in srgb,var(--red) 25%,transparent)}

  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px}
  .part{border:1px solid var(--line); border-radius:11px; background:var(--panel); padding:15px 16px; cursor:pointer; transition:border-color .12s, transform .12s}
  .part:hover{border-color:var(--brand-border); transform:translateY(-1px)}
  .part .pt{font-size:15px; font-weight:650; display:flex; align-items:center; gap:8px}
  .part .role{font-size:12.5px; color:var(--ink-3); margin:3px 0 10px}
  .part .meta{display:flex; flex-wrap:wrap; gap:6px}
  .part.repealed{opacity:.62} .part.repealed .pt{text-decoration:line-through; text-decoration-color:var(--ink-3)}

  .controls{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:16px}
  .search{flex:1; min-width:220px; position:relative}
  .search input{width:100%; background:var(--panel); border:1px solid var(--line); color:var(--ink); padding:11px 14px 11px 38px; border-radius:10px; font-size:14px; outline:none}
  .search input:focus{border-color:var(--brand)} .search .mag{position:absolute; left:13px; top:11px; color:var(--ink-3)}
  .chips{display:flex; flex-wrap:wrap; gap:7px}
  .chip{font-size:12.5px; padding:6px 12px; border-radius:20px; border:1px solid var(--line); background:var(--panel); color:var(--ink-2); cursor:pointer; user-select:none}
  .chip:hover{border-color:var(--line-2); color:var(--ink)} .chip.on{background:var(--brand-dim); border-color:var(--brand-border); color:var(--brand-hi)}
  .chip .c{opacity:.7; margin-left:4px}

  .prov{border:1px solid var(--line); border-radius:11px; background:var(--panel); margin-bottom:9px; overflow:hidden}
  .prov-head{display:flex; align-items:center; gap:13px; padding:14px 16px; cursor:pointer}
  .prov-head:hover{background:var(--panel-2)}
  .prov .ref{font-family:var(--font-mono); font-size:12.5px; color:var(--ink-2); background:var(--panel-2); padding:3px 8px; border-radius:6px; white-space:nowrap; flex:none; min-width:104px; text-align:center}
  .prov .rt{font-weight:700; font-size:16.5px; flex:1; color:var(--ink); letter-spacing:-.01em}
  .prov .rt .act{color:var(--ink-3); font-weight:400; font-size:13px; letter-spacing:0}
  .prov .hbadges{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end}
  .prov .caret{color:var(--ink-3); transition:transform .15s; flex:none} .prov.open .caret{transform:rotate(90deg)}
  .prov-body{display:none; padding:2px 16px 18px 133px; border-top:1px solid var(--line)}
  .prov.open .prov-body{display:block}
  .prov-body .brief{color:var(--ink-2); font-size:13.5px; margin:13px 0 4px; padding:11px 14px; background:color-mix(in srgb,var(--purple) 6%,var(--panel-2)); border:1px solid color-mix(in srgb,var(--purple) 18%,var(--line)); border-radius:9px}

     • the relevance profile   (…/cheque-dishonour-s138.profile.json)

/* ============================================================ HELPERS */
const $=(s,el=document)=>el.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const esc=s=>(s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const secNum=ref=>ref.split(":")[1].replace("sec_","§").replace(/_/g," ");
const actOf=ref=>SOURCES[ref.split(":")[0]];
const eraOf=a=>a==="always"?"always":(a.indexOf("pre")===0?"pre":"post");
function eraFromStatus(s){ s=s||""; if(/from\s*2024/i.test(s))return"post"; if(/repealed/i.test(s))return"pre"; return"always"; }
function eraBadge(a){const e=eraOf(a);return e==="always"?`<span class="badge b-always">any time</span>`:e==="pre"?`<span class="badge b-pre">pre-2024 code</span>`:`<span class="badge b-post">2023 Sanhita</span>`;}

/* ---- fetch + parse ---- */
async function fetchText(url){ const r=await fetch(url,{cache:"no-cache"}); if(!r.ok) throw new Error(r.status+" "+url); return r.text(); }
async function loadProfile(){
  let txt=null, err=null;
  for(const b of BASE_CANDIDATES){
    try{ txt=await fetchText(b+PROFILE_NAME); DATA_BASE=b; break; }catch(e){ err=e; }
  }
  if(txt==null) throw err||new Error("profile not found");
  const p=JSON.parse(txt); PROFILE=p;
  SOURCES={}; DOMAINS={};
  for(const [id,s] of Object.entries(p.sources)){
    SOURCES[id]={...s, era:eraFromStatus(s.status), casescoped:s.domain==="substantive"};
  }
  // domains present, in preferred order then any extras
  const present=new Set(Object.values(SOURCES).map(s=>s.domain));
  const ordered=[...DOMAIN_ORDER.filter(d=>present.has(d)), ...[...present].filter(d=>!DOMAIN_ORDER.includes(d))];
  ordered.forEach(d=>{ DOMAINS[d]=DOMAIN_LABELS[d]||{label:d.charAt(0).toUpperCase()+d.slice(1),blurb:""}; });
  PROVISIONS=p.provisions.map(x=>({ref:x.ref, act:x.act, eId:x.eId, tier:x.tier, role:x.role, applies:x.applies, note:x.note||""}));
  TERMS=p.terms||{};
  EDGES=p.edges||[];
  ALIAS_MAP=(p.act_alias_map||[]).map(a=>({topic:a.topic, before:a.before, after:a.on_or_after, note:a.note}));
  const note=$("#src-note"); if(note) note.textContent=`profile: ${p.profile} · as of ${p.as_of||''} · maintained by ${p.maintained_by||'PUCAR'}`;
  await loadCaselaw(p);
}
async function loadCaselaw(p){
  CASES=[]; CASE_TOPICS={}; CASES_BY_REF={};
  if(!p.caselaw) return;
  try{
    const cl=JSON.parse(await fetchText(DATA_BASE+p.caselaw));
    CASE_TOPICS=cl.topics||{};
    CASES=(cl.cases||[]).slice();
    CASES.forEach(c=>{ (c.construes||[]).forEach(ref=>{ (CASES_BY_REF[ref]=CASES_BY_REF[ref]||[]).push(c.id); }); });
  }catch(e){ /* case law optional */ }
}
async function getDoc(actId){
  if(docCache[actId]) return docCache[actId];
  const src=SOURCES[actId]; if(!src||!src.file) throw new Error("no file for "+actId);
  const xml=await fetchText(DATA_BASE+src.file);
  const doc=new DOMParser().parseFromString(xml,"application/xml");
  if(doc.getElementsByTagName("parsererror").length) throw new Error("XML parse error: "+src.file);
  docCache[actId]=doc; return doc;
}

/* ---- Akoma Ntoso element -> structured text ---- */
function childByLocal(node,ln){ for(const c of node.children) if(c.localName===ln) return c; return null; }
function cleanText(node){ return (node.textContent||"").replace(/\s+/g," ").trim(); }
function sectionData(sec){
  const numEl=childByLocal(sec,"num"), headEl=childByLocal(sec,"heading");
  const body=[];
  const STRUCT=["item","point","clause","subsection","paragraph","subparagraph"];
  function walk(node,depth){
    for(const c of node.children){
      const ln=c.localName;
      if(ln==="p"){ const t=cleanText(c); if(t) body.push(["p",depth,t]); }
      else if(ln==="blockList"||ln==="list"){ walk(c,depth); }
      else if(STRUCT.includes(ln)){
        const cn=childByLocal(c,"num"); const cnt=cn?cleanText(cn):"";
        const content=childByLocal(c,"content"); const target=content||c;
        let first=true;
        for(const cc of target.children){
          const l2=cc.localName;
          if(l2==="p"){ const t=cleanText(cc); if(t){ body.push(["li",depth, first?((cnt?cnt+" ":"")+t):t]); first=false; } }
          else if(l2==="blockList"||l2==="list"){ walk(cc,depth+1); }
          else if(STRUCT.includes(l2)){ walk(c,depth+1); break; }
        }
        if(first && cnt) body.push(["li",depth,cnt]);
      }
      else if(ln==="content"){ walk(c,depth); }
      else if(ln==="num"||ln==="heading"||ln==="authorialNote"){ /* skip */ }
      else { walk(c,depth); }
    }
  }
  walk(sec,0);
  return {num:numEl?cleanText(numEl):"", heading:headEl?cleanText(headEl):"", body};
}
async function sectionByRef(ref){
  const [a,eid]=ref.split(":");
  const doc=await getDoc(a);
  const node=doc.querySelector(`[eId="${eid}"]`);
  return node?sectionData(node):null;
}
function actBlocks(doc){
  const blocks=[]; const SEP=["chapter","part","title"];
  (function walk(node){
    for(const c of node.children){
      const ln=c.localName;
      if((ln==="section"||ln==="article") && c.getAttribute("eId")){
        const d=sectionData(c); blocks.push({t:"sec", unit:ln, eId:c.getAttribute("eId"), ...d});
      } else if(SEP.includes(ln)){
        const n=childByLocal(c,"num"), h=childByLocal(c,"heading");
        const label=[n?cleanText(n):"", h?cleanText(h):""].filter(Boolean).join(" ");
        if(label) blocks.push({t:"chap", label});
        walk(c);
      } else walk(c);
    }
  })(doc.documentElement);
  return blocks;
}

/* ---- render a flat [type,depth,text] body as nested clause lists ---- */
function liRow(txt){
  const m=txt.match(/^(\([^)]{1,6}\))\s*([\s\S]*)$/);
  if(m) return `<div class="litem"><span class="lmark">${esc(m[1])}</span><span class="ltext">${esc(m[2])}</span></div>`;
  return `<div class="litem"><span class="lmark"></span><span class="ltext">${esc(txt)}</span></div>`;
}
/* detect statutory annotations (Explanation / Proviso / Illustration / Exception)
   so they don't read like the bare enacting text */
function legNote(txt){
  let m;
  if(m=txt.match(/^(Explanations?(?:\s+[IVXLC]+)?)\s*\.?\s*[—–-]+\s*([\s\S]*)$/i)) return {label:m[1],text:m[2]};
  if(m=txt.match(/^(Illustrations?)\s*\.?\s*[—–:-]+\s*([\s\S]*)$/i)) return {label:m[1],text:m[2]};
  if(m=txt.match(/^(Exception(?:\s+\d+)?)\s*\.?\s*[—–-]+\s*([\s\S]*)$/i)) return {label:m[1],text:m[2]};
  if(/^Provided\b/i.test(txt)) return {label:"Proviso",text:txt};
  return null;
}
function noteHTML(n){ return `<div class="legnote"><span class="lnl">${esc(n.label)}</span><span class="lnt">${esc(n.text)}</span></div>`; }
function renderBody(body,pfx){
  let html=""; const stack=[];
  const openTo=n=>{ while(stack.length<n){html+='<div class="lgroup">';stack.push(1);} while(stack.length>n){html+='</div>';stack.pop();} };
  (body||[]).forEach(([t,d,txt])=>{
    const n=legNote(txt);
    if(n){ openTo(t==="p"?0:d+1); html+=noteHTML(n); }
    else if(t==="p"){ openTo(0); html+=`<p class="${pfx}-p">${esc(txt)}</p>`; }
    else { openTo(d+1); html+=liRow(txt); }
  });
  openTo(0);
  return html;
}

/* ---- statute markup (from parsed data) ---- */
function statuteMarkup(ref,d,mini){
  if(!d) return `<div class="statute"><div class="st-src">section not found in the Act file</div></div>`;
  let h=`<div class="statute${mini?' statute-mini':''}"><div class="st-src">${ic('book-open')} from ${esc(actOf(ref).title)} &middot; ${esc(actOf(ref).file)}</div>`;
  if(d.num||d.heading) h+=`<div class="st-h"><span class="st-num">${esc(d.num||'')}</span>${esc(d.heading||'')}</div>`;
  h+=renderBody(d.body,"st");
  h+=`<button class="view-full" data-ref="${esc(ref)}">${ic('maximize-2')}&nbsp; Read this section inside the whole Act</button>`;
  return h+"</div>";
}
async function fillStatute(slot,mini){
  if(slot.dataset.loaded) return; slot.dataset.loaded="1";
  const ref=slot.dataset.ref;
  slot.innerHTML=`<div class="statute"><div class="st-src"><span class="spinner" style="width:14px;height:14px;border-width:2px;margin:0"></span> loading the section from the Act…</div></div>`;
  try{ const d=await sectionByRef(ref); slot.innerHTML=statuteMarkup(ref,d,mini); }
  catch(e){ slot.innerHTML=`<div class="statute"><div class="st-src">couldn't load — the Act files load over http (see the note under the sidebar)</div></div>`; }
}

      if(state.q){const hay=(p.ref+" "+p.role+" "+(p.note||"")+" "+actOf(p.ref).title).toLowerCase(); if(!hay.includes(state.q))return false;}
      return true;
    });
    if(!rows.length){list.appendChild(el("div","empty","Nothing matches those filters."));return;}
    const order=Object.keys(SOURCES); rows.sort((a,b)=>order.indexOf(a.act)-order.indexOf(b.act));

  }
  eraChips.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{eraChips.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));c.classList.add("on");state.era=c.dataset.era;draw();});

  setTimeout(()=>{const inp=$("#p-search"); if(inp)inp.oninput=e=>{state.q=e.target.value.toLowerCase().trim();draw();};},0);
  draw();
  return m;
};

/* ---- case law helpers ---- */
function provRefShort(ref){
  const [a,eid]=ref.split(":"); const s=SOURCES[a];
  const n=eid.indexOf("art_")===0 ? ("Art. "+eid.slice(4)) : ("§"+eid.replace("sec_",""));
  const t=s?s.title.split(",")[0].replace(/^Bharatiya /,"").replace(/^The /,""):a;
  return n+" · "+t;
}
function benchShort(b){ return b>=5?("Constitution Bench · "+b):(b+"-judge"); }
function caseStatusBadge(st){
  if(st==="good-law") return `<span class="badge b-good">good law</span>`;
  if(st==="partly-overruled") return `<span class="badge b-partly">partly overruled</span>`;
  if(st==="overruled") return `<span class="badge b-overruled">overruled</span>`;
  if(st==="legislatively-superseded") return `<span class="badge b-super">superseded by statute</span>`;
  return "";
}
function caseCard(c){
  const rels=(c.relations||[]).map(r=>{
    const tgt=caseById2(r.to); const nm=tgt?tgt.name:r.to;
    return `<div class="rels-c">↳ <b>${r.rel.replace(/-/g," ")}</b> ${esc(nm)}${r.note?` — ${esc(r.note)}`:""}</div>`;
  }).join("");
  const chips=(c.construes||[]).map(ref=>`<span class="cchip" data-ref="${esc(ref)}">${esc(provRefShort(ref))}</span>`).join("");
  const topics=(c.topics||[]).map(t=>`<span class="badge b-topic">${esc(CASE_TOPICS[t]||t)}</span>`).join("");
  const neutral=c.neutral_citation?`<span class="cite neutral">${esc(c.neutral_citation)}</span>`:"";
  const actions = c.akn
    ? `<a class="readjmt" data-caseid="${esc(c.id)}">Read judgment</a>${c.decided?`<span class="jdec">decided ${esc(c.decided)}</span>`:""}`
    : `<span class="jwarn" title="${esc(c.source_issue||'source document is not the Supreme Court judgment')}">⚠ SC judgment not yet linked${c.source_issue?` — ${esc(c.source_issue)}`:""}</span>`;
  return `<div class="case" id="case-${esc(c.id)}">
    <div class="cn">${esc(c.name)}</div>
    <div class="cmeta"><span class="cite">${esc(c.citation)}</span>${neutral}<span class="badge b-bench">${esc(benchShort(c.bench))}</span>${caseStatusBadge(c.status)}${topics}</div>
    <div class="hold">${esc(c.holding)}</div>
    ${chips?`<div class="construes"><span class="clabel">Construes</span>${chips}</div>`:""}
    ${rels}
    <div class="cactions">${actions}</div>
  </div>`;
}
function casesFor(ref){
  const ids=CASES_BY_REF[ref]||[]; if(!ids.length) return "";
  const items=ids.map(id=>{const c=caseById2(id); if(!c)return ""; return `<div class="ic" data-caseid="${esc(id)}"><span class="icn">${esc(c.name)}</span> <span class="icy">${esc(c.citation)} · ${esc(benchShort(c.bench))}</span></div>`;}).join("");
  return `<div class="interp"><div class="il">Interpreted by ${ids.length} Supreme Court case${ids.length>1?"s":""}</div>${items}</div>`;
}
function jumpToProvision(ref){
  go("provisions");
  setTimeout(()=>{ const r=document.getElementById("prov-"+ref.replace(/:/g,"_")); if(r){ if(!r.classList.contains("open")){ r.classList.add("open"); const slot=r.querySelector(".statute-slot"); if(slot) fillStatute(slot);} r.scrollIntoView({block:"center"}); r.style.outline="2px solid var(--brand)"; r.style.outlineOffset="-1px"; setTimeout(()=>{r.style.outline="";},1800);} },70);
}
function jumpToCase(id){

}

/* ============================================================ FULL-ACT MODAL */
function renderFullAct(actId, blocks, focusEid){
  const src=SOURCES[actId];
  const nsec=blocks.filter(b=>b.t==="sec").length;
  const unit=blocks.some(b=>b.unit==="article")?"articles":"sections";
  const wrap=el("div");
  const focusLabel = focusEid ? secNum(actId+":"+focusEid) : "";
  wrap.appendChild(el("div","actdoc-h",
    `<div class="ad-title">${esc(src.title)}</div>
     <div class="ad-sub">${nsec} ${unit} · verbatim Akoma Ntoso (${esc(src.file)})${focusEid?` · jumped to ${esc(focusLabel)}`:''}</div>`));
  const body=el("div","actdoc-body");
  if(!nsec) body.appendChild(el("div","callout amber",`This Act's full text isn't in the corpus yet — its Akoma&nbsp;Ntoso conversion is incomplete, so only structural headings are present.`));
  blocks.forEach(b=>{
    if(b.t==="chap"){ body.appendChild(el("div","ad-chap",esc(b.label))); return; }
    const secEl=el("div","ad-sec"+(b.eId===focusEid?" focus":""));
    if(b.eId) secEl.id="adsec-"+b.eId;
    let h=`<div class="ad-sec-h"><span class="ad-num">${esc(b.num||'')}</span>${esc(b.heading||'')}${b.eId===focusEid?'<span class="ad-focus-tag">the section you came from</span>':''}</div>`;
    h+=renderBody(b.body,"ad");
    secEl.innerHTML=h; body.appendChild(secEl);
  });
  wrap.appendChild(body);
  return wrap;
}
async function openActModal(actId, focusEid){
  const modal=$("#modal"), body=$("#modal-body");
  body.innerHTML=`<div class="ad-loading"><div class="spinner"></div>Loading the full Act…</div>`;
  modal.classList.add("show"); document.body.style.overflow="hidden";
  try{
    const doc=await getDoc(actId);
    const blocks=actBlocks(doc);
    body.innerHTML=""; body.appendChild(renderFullAct(actId,blocks,focusEid));
    if(focusEid){ const t=document.getElementById("adsec-"+focusEid); if(t) setTimeout(()=>t.scrollIntoView({block:"center"}),60); }
    else body.scrollTop=0;
  }catch(e){
    body.innerHTML=`<div class="ad-loading">Couldn't load this Act.<br><br>The viewer reads the <code>.akn.xml</code> files live, so it must be served over http — see the note under the sidebar.</div>`;
  }
}
function closeModal(){ $("#modal").classList.remove("show"); document.body.style.overflow=""; }

/* ============================================================ JUDGMENT MODAL */
let jmtCache={};
async function getJudgment(caseId, aknPath){
  if(jmtCache[caseId]) return jmtCache[caseId];
  const xml=await fetchText(DATA_BASE+aknPath);
  const doc=new DOMParser().parseFromString(xml,"application/xml");
  if(doc.getElementsByTagName("parsererror").length) throw new Error("XML parse error: "+aknPath);
  jmtCache[caseId]=doc; return doc;
}
function judgmentHeader(doc){
  const h=doc.getElementsByTagName("header")[0]; const out={};
  if(h) for(const p of h.children){ const cl=p.getAttribute("class"); if(cl) out[cl]=cleanText(p); }
  return out;
}
function renderJudgment(c, doc){
  const H=judgmentHeader(doc);
  const wrap=el("div");
  const sub=[H.court||"Supreme Court of India"];
  if(H.judgmentDate) sub.push(H.judgmentDate);
  if(c.neutral_citation||H.neutralCitation) sub.push(c.neutral_citation||H.neutralCitation);
  wrap.appendChild(el("div","actdoc-h",
    `<div class="ad-title">${esc(c.name)}</div>
     <div class="ad-sub">${esc(sub.join(" · "))} · verbatim Akoma Ntoso (${esc((c.akn||"").split("/").pop())})</div>`));
  const body=el("div","actdoc-body");
  const cap=el("div","jcap");
  cap.innerHTML=`${H.docketNumber?`<div class="jrow strong">${esc(H.docketNumber)}</div>`:''}
    <div class="jrow">${esc(H.reportCitation||c.citation||'')}${H.neutralCitation?` &nbsp;·&nbsp; ${esc(H.neutralCitation)}`:''}</div>
    ${H.bench?`<div class="jrow">${esc(H.bench)}</div>`:''}
    ${H.author?`<div class="jrow">${esc(H.author)}</div>`:''}`;
  body.appendChild(cap);
  const jb=doc.getElementsByTagName("judgmentBody")[0];
  const LAB={introduction:"Introduction",background:"Background",arguments:"Arguments",motivation:"The Court's reasoning",remedies:"Remedies",decision:"Decision"};
  if(jb) for(const sec of jb.children){
    const ln=sec.localName;
    body.appendChild(el("div","ad-chap",LAB[ln]||ln));
    for(const ch of sec.children){
      if(ch.localName==="p"){ body.appendChild(el("div","jpara",`<div class="jp">${esc(cleanText(ch))}</div>`)); }
      else if(ch.localName==="paragraph"){
        const num=childByLocal(ch,"num"), content=childByLocal(ch,"content");
        const pn=num?cleanText(num):"";
        let txt=""; if(content) for(const cc of content.children){ if(cc.localName==="p"){ const t=cleanText(cc); if(t) txt+=(txt?" ":"")+t; } }
        body.appendChild(el("div","jpara",`<div class="jp"><span class="jnum">${esc(pn)}</span>${esc(txt)}</div>`));
      }
    }
  }
  wrap.appendChild(body);
  return wrap;
}
async function openJudgmentModal(caseId){
  const c=caseById2(caseId); if(!c||!c.akn) return;
  const modal=$("#modal"), body=$("#modal-body");
  body.innerHTML=`<div class="ad-loading"><div class="spinner"></div>Loading the judgment…</div>`;
  modal.classList.add("show"); document.body.style.overflow="hidden";
  try{
    const doc=await getJudgment(caseId,c.akn);
    body.innerHTML=""; body.appendChild(renderJudgment(c,doc)); body.scrollTop=0;
  }catch(e){
    body.innerHTML=`<div class="ad-loading">Couldn't load this judgment.<br><br>The viewer reads the <code>.akn.xml</code> files live, so it must be served over http — see the note under the sidebar.</div>`;
  }
}

/* ============================================================ ROUTER + BOOT */
function buildNav(){
  const c=caseById(activeCase);
  const nav=$("#nav");
  const st=stateById(activeState);
  nav.innerHTML=`
    <div class="casedd" id="casedd">
      <button class="casedd-btn" id="caseddBtn">
        <div class="ac-eyebrow">Active case type</div>
        <div class="ac-name">${c.name} <span>· ${c.act.split('·').pop().trim()}</span></div>
        <span class="casedd-chev">${ic('chevron-down')}</span>
      </button>
      <div class="casedd-menu" id="caseddMenu">
        ${CASE_TYPES.map(ct=>{const on=ct.id===activeCase, planned=ct.status!=="active"; return `<div class="casedd-item ${on?'on':''} ${planned?'planned':''}" data-id="${ct.id}"><span>${ct.name} <span class="ci-sub">· ${ct.act.split('·').pop().trim()}</span></span>${on?'<span class="ci-check">✓ active</span>':(planned?'<span class="ci-check" style="color:var(--ink-3)">soon</span>':'')}</div>`;}).join("")}
      </div>
    </div>
    <div class="casedd statedd" id="statedd">
      <button class="casedd-btn" id="stateBtn">
        <div class="ac-eyebrow">${ic('map-pin')} State</div>
        <div class="ac-name">${st.name}</div>
        <span class="casedd-chev">${ic('chevron-down')}</span>
      </button>
      <div class="casedd-menu" id="stateMenu">
        ${JURISDICTIONS.map(s=>{const on=s.id===activeState; return `<div class="casedd-item ${on?'on':''}" data-state="${s.id}"><span>${s.name}</span>${on?'<span class="ci-check">✓</span>':''}</div>`;}).join("")}
      </div>
    </div>
    <div class="nav-group">Central law</div>
    <div class="nav-scoped">
      <a data-view="parts"><span class="ico">${ic('library')}</span> Acts <span class="count">${isModelled()?Object.keys(SOURCES).length:'—'}</span></a>
      <a data-view="provisions"><span class="ico">${ic('file-text')}</span> Provisions <span class="count">${isModelled()?PROVISIONS.length:'—'}</span></a>
      <a data-view="caselaw"><span class="ico">${ic('scale')}</span> Case law <span class="count">${isModelled()?(CASES.length||'—'):'—'}</span></a>
    </div>
    <div class="nav-group">Domain &amp; culture</div>
    <div class="nav-scoped">
      <a data-view="practice"><span class="ico">${ic('messages-square')}</span> Local practice <span class="count">${isModelled()?PRACTICE_NOTES.length:'—'}</span></a>
      <a data-view="words"><span class="ico">${ic('type')}</span> Vocabulary <span class="count">${isModelled()?Object.keys(TERMS).length:'—'}</span></a>
    </div>`;
  // Overview lives subtly in the sidebar footer, not at the top
  const ov=$("#ovNav");
  if(ov) ov.innerHTML=`
    <div class="scoped-wrap ov-foot ${overviewOpen?'':'ov-collapsed'}">
      <a data-view="overview" class="ov-toggle"><span class="ico">${ic('home')}</span> Overview <span class="nav-chev">${ic('chevron-down')}</span></a>
      <div class="nav-sub"><div class="nav-sub-inner">
        <a data-view="structure" class="subnav">The structure</a>
        <a data-view="split" class="subnav">Shared vs State</a>
        <a data-view="time" class="subnav">The 2024 code switch</a>
      </div></div>
    </div>`;
  const tb=$("#tbCase"); if(tb) tb.textContent=`${c.name} · ${c.act.split('·').pop().trim()}`;
  document.querySelectorAll("#nav a[data-view], #ovNav a[data-view]").forEach(a=>a.onclick=()=>{
    if(a.classList.contains("ov-toggle")){
      const w=a.closest(".scoped-wrap");
      w.classList.toggle("ov-collapsed");
      overviewOpen=!w.classList.contains("ov-collapsed");
    }
    go(a.dataset.view);
    setDrawer(false);
  });
  const dd=$("#casedd",nav), btn=$("#caseddBtn",nav);
  const sdd=$("#statedd",nav), sbtn=$("#stateBtn",nav);
  if(btn) btn.onclick=e=>{ e.stopPropagation(); sdd.classList.remove("open"); dd.classList.toggle("open"); };
  if(sbtn) sbtn.onclick=e=>{ e.stopPropagation(); dd.classList.remove("open"); sdd.classList.toggle("open"); };
  nav.querySelectorAll(".casedd-item[data-id]").forEach(it=>it.onclick=()=>{
    const ct=caseById(it.dataset.id);
    if(ct && ct.status==="active"){ activeCase=ct.id; buildNav(); go("overview"); }
    else dd.classList.remove("open");
  });
  nav.querySelectorAll(".casedd-item[data-state]").forEach(it=>it.onclick=()=>{
    activeState=it.dataset.state; sdd.classList.remove("open"); buildNav();
    go(currentView); // re-render: some views (e.g. Local practice) depend on the state
  });
}
function setMain(node){const main=$("#main"); main.innerHTML=""; main.appendChild(node); window.scrollTo(0,0);}
function go(view){
  if(!V[view]) view="overview";
  currentView=view;
  if(OV_SUBVIEWS.includes(view)){
    overviewOpen=true;
    const w=document.querySelector(".sidebar .scoped-wrap"); if(w) w.classList.remove("ov-collapsed");
  }
  document.querySelectorAll("#nav a[data-view], #ovNav a[data-view]").forEach(a=>a.classList.toggle("active", a.dataset.view===view));
  setMain(V[view]());
  if(history.replaceState) history.replaceState(null,"","#"+view);
}
window.go=go;

/* theme toggle */
function setTheme(t){document.documentElement.classList.toggle("dark",t==="dark"); document.querySelectorAll(".tt-opt").forEach(o=>o.classList.toggle("on",o.dataset.t===t));}
document.querySelectorAll(".tt-opt").forEach(o=>o.onclick=()=>setTheme(o.dataset.t));
setTheme("dark");
$("#brand").onclick=()=>go("overview");

/* mobile off-canvas sidebar */
function setDrawer(open){
  const sb=$("#sidebar"), bd=$("#backdrop");
  if(sb) sb.classList.toggle("open",open);
  if(bd) bd.classList.toggle("show",open);
}
(function(){
  const hb=$("#hamburger"), bd=$("#backdrop");
  if(hb) hb.onclick=()=>setDrawer(!$("#sidebar").classList.contains("open"));
  if(bd) bd.onclick=()=>setDrawer(false);
  const tbCase=$("#tbCase"); if(tbCase) tbCase.onclick=()=>setDrawer(true);
})();

/* delegated: open the full-Act modal from any "view-full" button */
document.addEventListener("click",e=>{
  const b=e.target.closest(".view-full");
  if(b){ if(b.dataset.ref){const [a,eid]=b.dataset.ref.split(":"); openActModal(a,eid);} else if(b.dataset.act){ openActModal(b.dataset.act);} return; }
  if(e.target.closest("[data-close]")){ closeModal(); return; }
  const chip=e.target.closest(".cchip"); if(chip && chip.dataset.ref){ jumpToProvision(chip.dataset.ref); return; }
  const ic=e.target.closest(".ic"); if(ic && ic.dataset.caseid){ jumpToCase(ic.dataset.caseid); return; }
  const rj=e.target.closest(".readjmt"); if(rj && rj.dataset.caseid){ openJudgmentModal(rj.dataset.caseid); return; }
  const dd=$("#casedd"); if(dd && !e.target.closest("#casedd")) dd.classList.remove("open");
  const sdd=$("#statedd"); if(sdd && !e.target.closest("#statedd")) sdd.classList.remove("open");
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeModal(); });

/* boot: load the profile, then render */
function showLoadError(err){
  const served = location.protocol!=="file:";
  $("#main").innerHTML=`<div class="loadbox">
    <h2>${served?"Couldn't load the corpus":"Open this over a local server"}</h2>
    <p>This viewer reads the profile and the Akoma&nbsp;Ntoso Act files <b>live from disk</b> — nothing is baked in. Browsers block that when a page is opened straight from a file, so it needs to be served over http.</p>
    <div class="cmd"># from the dristi-domain-model folder:<br>python3 -m http.server 8000<br><br># then open:<br>http://localhost:8000/</div>
    <p class="tiny">Looked for <code>${esc(PROFILE_NAME)}</code> under: ${BASE_CANDIDATES.map(b=>`<code>${esc(b||'./')}</code>`).join(" ")}${served?`<br>Last error: ${esc(String(err&&err.message||err))}`:""}</p>
  </div>`;
}
(async()=>{
  $("#main").innerHTML=`<div class="loadbox"><div class="spinner"></div><p>Loading the domain model from the corpus…</p></div>`;
  try{
    await loadProfile();
    buildNav();
    const start=(location.hash||"#overview").slice(1);
    go(V[start]?start:"overview");
  }catch(err){ showLoadError(err); }
})();
</script>
