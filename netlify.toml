# Netlify config — static site. The only build step regenerates the agent-facing
# artifacts (the denormalized bundle, digest, schemas, llms.txt, README block) from
# the data, so the deployed copies can never drift from the source of truth.
# The deployable site is the public/ folder (index.html + data/ + domain/ + llms.txt).

[build]
  publish = "public"
  # Install the build-time checkers first (see requirements.txt). If pip fails the
  # generator still runs and publishes, but with its checks skipped and a loud line
  # in the log - a stale deploy is worse than an unchecked one.
  command = "pip install -r requirements.txt || echo 'WARNING: pip install failed - self-checks will be skipped'; python3 scripts/generate_agent_artifacts.py"

# Long-cache the immutable legal source files; the HTML stays revalidated.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
